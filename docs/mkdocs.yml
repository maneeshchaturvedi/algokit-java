site_name: AlgoKit Java
site_description: Battle-tested building blocks for coding interviews
site_url: https://maneeshchaturvedi.github.io/algokit-java/
repo_url: https://github.com/maneeshchaturvedi/algokit-java

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Pattern Recognition: patterns/recognition.md
  - Collections Guide: patterns/collections.md
  - Pitfall Checklist: patterns/pitfalls.md
  - API Reference:
    - Arrays & Strings: api/arrays.md
    - Binary Search: api/search.md
    - Sliding Window: api/window.md
    - Monotonic Stack: api/stack.md
    - Linked Lists: api/list.md
    - Trees: api/tree.md
    - Graphs: api/graph.md
    - Intervals: api/intervals.md
    - Dynamic Programming: api/dp.md
    - Backtracking: api/backtrack.md
    - Data Structures: api/structures.md
    - Text Processing: api/text.md
